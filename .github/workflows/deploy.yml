name: deploy

on:
  # 5 分ごとの起動は Cloudflare Workers の Cron から workflow_dispatch で行う（AC-21）。
  # schedule は GitHub 側で間引かれるので、Worker が止まったときの予備として 1 時間ごとに残す
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 実行中のデプロイは止めず、待機中の古い実行は新しい実行に置き換える
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # コードやデータが変わったときだけ実行し、定期実行では省く
      - name: Test
        if: github.event_name != 'schedule'
        run: npm test

      # データの検証と配信状態の取得。検証エラーなら失敗し、デプロイされない（AC-23）
      - name: Generate site data
        run: npm run generate
        env:
          # 前回の state.json を読む公開サイトの URL（AC-43）。リポジトリの変数で設定する
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - run: npm run build

      # 配信されるファイルに秘密情報が含まれていないことを確かめる（AC-26）
      - name: Check secrets are not in dist
        run: |
          for name in TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET YOUTUBE_API_KEY CLOUDFLARE_API_TOKEN; do
            value="${!name}"
            if [ -n "$value" ] && grep -rqF -- "$value" dist; then
              echo "::error::dist に $name の値が含まれています"
              exit 1
            fi
          done
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Cloudflare Pages に公開する（AC-41）。プロジェクトは事前に作っておく
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=ltk4-livenow-unofficial --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
