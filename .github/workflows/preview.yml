name: preview

# 画面に関わる変更の PR を、本番とは別の URL に出す（AC-11）
on:
  pull_request:
    paths:
      - "src/web/**"
      - "src/shared/**"
      - "vite.config.ts"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # フォークからの PR には Secret が渡らないので動かさない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # 配信状態は取得せず、本番のデータを借りる（YouTube のクォータを使わない）
      - name: Copy site data from production
        run: curl -fsSL "${PUBLIC_SITE_URL%/}/site-data.json" -o dist/site-data.json
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      # 配信されるファイルに秘密情報が含まれていないことを確かめる（AC-13）
      - name: Check secrets are not in dist
        run: |
          for name in TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET YOUTUBE_API_KEY CLOUDFLARE_API_TOKEN CLAUDE_CODE_OAUTH_TOKEN; do
            value="${!name}"
            if [ -n "$value" ] && grep -rqF -- "$value" dist; then
              echo "::error::dist に $name の値が含まれています"
              exit 1
            fi
          done
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Cloudflare のトークンはこのステップにだけ渡す。--branch が main でないのでプレビューになる
      - name: Deploy preview
        id: deploy
        run: |
          npx wrangler pages deploy dist --project-name=ltk4-livenow-unofficial --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::プレビューの URL を取得できませんでした"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 同じ PR では 1 つのコメントを更新する
      - name: Comment preview URL
        run: |
          marker="<!-- preview-url -->"
          body="$marker
          プレビュー: $URL
          （コミット ${SHA:0:7}。配信状態は本番のデータを使っています）"
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
