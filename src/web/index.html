<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LTK4 Live Now</title>
    <meta name="description" content="LTK 出場者の配信状況をひと目で確認できる非公式ファンサイトです。" />
    <meta property="og:title" content="LTK4 Live Now" />
    <meta property="og:description" content="LTK 出場者の配信状況をひと目で確認できる非公式ファンサイトです。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ltk4-livenow-unofficial.pages.dev/" />
    <meta property="og:site_name" content="LTK4 Live Now" />
    <meta property="og:image" content="https://ltk4-livenow-unofficial.pages.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 保存したテーマを描画前に当て、ライトからのちらつきを防ぐ（AC-39） -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("ltk-stream-status:theme:v1") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
