<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LTK Stream Status</title>
    <!-- 保存したテーマを描画前に当て、ライトからのちらつきを防ぐ（AC-39） -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("ltk-stream-status:theme:v1") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
